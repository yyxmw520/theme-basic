<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在进入梦幻漫画...</title>
  <script>
    const fallbackUrl = 'https://520menghuan.pages.dev';
    fetch('https://jsonblob.com/api/jsonBlob/019fe139-7dca-7555-9ee0-3fce11b7810f')
      .then(res => res.json())
      .then(data => {
        const targetUrl = (data && (data.pagesUrl || data.url)) ? (data.pagesUrl || data.url) : fallbackUrl;
        window.location.replace(targetUrl);
      })
      .catch(() => {
        window.location.replace(fallbackUrl);
      });
  </script>
</head>

</body>
</html>
