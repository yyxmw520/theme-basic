<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在进入梦幻漫画...</title>
  <style>
    body { background-color: #0f172a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px; }
    .card { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); padding: 32px 24px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); max-width: 360px; width: 100%; backdrop-filter: blur(12px); box-sizing: border-box; }
    .spinner { width: 44px; height: 44px; border: 4px solid rgba(251, 114, 153, 0.2); border-top-color: #fb7299; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.2rem; font-weight: 700; margin: 0 0 10px; color: #ffffff; }
    p { font-size: 0.85rem; color: #94a3b8; margin: 0 0 20px; line-height: 1.5; }
    .btn { display: block; background: linear-gradient(90deg, #ec4899, #8b5cf6); color: #ffffff; text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 12px; font-size: 0.92rem; width: 100%; box-sizing: border-box; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); }
    .notice { font-size: 0.78rem; color: #94a3b8; margin-top: 16px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>正在为您接入梦幻漫画...</h2>
    <p id="status-text">安全数据隧道建立中，请稍候...</p>
    <a id="direct-btn" href="#" class="btn" style="display: none;">点击直接进入梦幻漫画</a>
    <div class="notice">💡 提示：跳转后若出现 Ngrok 提示页，只需点击页面中间蓝色的 <strong>"Visit Site"</strong> 按钮即可进入主站。</div>
  </div>

  <script>
    const statusText = document.getElementById('status-text');
    const directBtn = document.getElementById('direct-btn');

    const fallbackUrl = 'https://520menghuan.pages.dev';

    fetch(`https://jsonblob.com/api/jsonBlob/019fe139-7dca-7555-9ee0-3fce11b7810f?t=${Date.now()}`)
      .then(res => res.json())
      .then(data => {
        const targetUrl = (data && (data.pagesUrl || data.url)) ? (data.pagesUrl || data.url) : fallbackUrl;
        directBtn.href = targetUrl;
        directBtn.style.display = 'block';
        statusText.innerText = '节点通道准备就绪，即将为您跳转...';
        window.location.href = targetUrl;
      })
      .catch(() => {
        directBtn.href = fallbackUrl;
        directBtn.style.display = 'block';
        statusText.innerText = '节点通道准备就绪，即将为您跳转...';
        window.location.href = fallbackUrl;
      });
  </script>
</body>
</html>
