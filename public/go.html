<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>正在进入梦幻漫画...</title>
  <script>
    const OBJECT_ID = 'ff8081819f7e10ae019fcf6497ae7500';
    fetch(`https://api.restful-api.dev/objects/${OBJECT_ID}?t=${Date.now()}`)
      .then(res => res.json())
      .then(data => {
        if (data && data.data && data.data.url) {
          window.location.replace(data.data.url);
        } else {
          document.body.innerHTML = '<div style="font-family:sans-serif;text-align:center;padding-top:100px;color:#666;">🌙 漫画数据库维护中，请稍后再试...</div>';
        }
      })
      .catch(() => {
        document.body.innerHTML = '<div style="font-family:sans-serif;text-align:center;padding-top:100px;color:#666;">🌙 漫画数据库维护中，请稍后再试...</div>';
      });
  </script>
</head>
<body style="background-color: #f4f5f9; margin: 0;">
</body>
</html>
