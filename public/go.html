<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>梦幻漫画 · 节点路由中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f4f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .btn-pink { background-color: #fb7299; color: #ffffff; }
    .btn-pink:hover { background-color: #f06288; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl p-6 shadow-xl border border-pink-100 text-center">
    <!-- Icon -->
    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-pink-50 flex items-center justify-center text-[#fb7299]">
      <svg class="w-8 h-8 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>

    <h1 class="text-xl font-bold text-gray-900 mb-2">梦幻漫画</h1>

    <!-- Checking State -->
    <div id="checking-state" class="py-6 text-gray-500 text-sm flex flex-col items-center gap-3">
      <div class="w-7 h-7 border-2 border-[#fb7299] border-t-transparent rounded-full animate-spin"></div>
      <span>正在为您匹配最新的免翻墙节点...</span>
    </div>

    <!-- Success State -->
    <div id="success-state" class="hidden py-6 text-emerald-600 text-sm font-semibold">
      ✅ 节点匹配成功！正在进入梦幻漫画...
    </div>

    <!-- Offline State -->
    <div id="offline-state" class="hidden py-4">
      <div class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-600 mb-3 border border-amber-200">
        🌙 服务器休眠 / 维护中
      </div>
      <p class="text-sm text-gray-600 leading-relaxed mb-6">
        当前数据库主节点正处于关机休眠或维护状态。<br />
        管理者在电脑上双击启动服务后，页面将自动重连！
      </p>

      <div class="space-y-3">
        <button 
          onclick="checkNode()" 
          class="w-full py-2.5 px-4 btn-pink font-medium rounded-xl text-sm transition-all shadow-md active:scale-95 flex items-center justify-center gap-2"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>重新检测节点状态</span>
        </button>

        <a 
          href="/" 
          class="block w-full py-2.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl text-sm transition-all"
        >
          🛒 返回 VIP 发卡卡密商城
        </a>
      </div>
    </div>

    <div class="mt-6 pt-4 border-t border-gray-100 text-xs text-gray-400">
      梦幻漫画 Node Gateway · 哔哩哔哩主题适配
    </div>
  </div>

  <script>
    const OBJECT_ID = 'ff8081819f7e10ae019fcf6497ae7500';

    async function checkNode() {
      const checking = document.getElementById('checking-state');
      const success = document.getElementById('success-state');
      const offline = document.getElementById('offline-state');

      checking.classList.remove('hidden');
      success.classList.add('hidden');
      offline.classList.add('hidden');

      let targetUrl = '';

      // Check query param first
      const params = new URLSearchParams(window.location.search);
      if (params.get('node')) {
        targetUrl = params.get('node');
      } else {
        try {
          const res = await fetch(`https://api.restful-api.dev/objects/${OBJECT_ID}?t=${Date.now()}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.data && data.data.url) {
              targetUrl = data.data.url;
            }
          }
        } catch(e) {}
      }

      if (targetUrl) {
        checking.classList.add('hidden');
        success.classList.remove('hidden');
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 150);
        return;
      }

      checking.classList.add('hidden');
      offline.classList.remove('hidden');
    }

    checkNode();
  </script>
</body>
</html>
